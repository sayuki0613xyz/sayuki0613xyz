<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Habit — 习惯追踪</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#86868b;--line:#e8e8ed;--soft:#f1f1f3;--green:#34c759;--orange:#ff9f0a;--red:#ff3b30;--shadow:0 8px 28px rgba(0,0,0,.05);--radius:22px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;min-height:100%}button,input,select,textarea{font:inherit}button{cursor:pointer}.app-shell{max-width:1180px;margin:auto;min-height:100vh;display:grid;grid-template-columns:250px 1fr;gap:22px;padding:22px}.sidebar{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:18px;height:calc(100vh - 44px);position:sticky;top:22px;display:flex;flex-direction:column;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:12px;padding:10px 8px 22px}.brand-icon{width:44px;height:44px;border-radius:14px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-size:24px}.brand h1{font-size:20px;margin:0}.brand small{color:var(--muted)}.nav{display:flex;flex-direction:column;gap:8px}.nav button{border:0;background:transparent;color:var(--text);text-align:left;padding:13px 14px;border-radius:14px;display:flex;gap:12px;align-items:center;font-weight:650}.nav button.active{background:var(--soft)}.nav .icon{width:24px;text-align:center}.sidebar-bottom{margin-top:auto;color:var(--muted);font-size:12px;padding:8px}.main{min-width:0;padding-bottom:100px}.page{display:none}.page.active{display:block}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;padding:6px 2px}.eyebrow{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.08em}.title{font-size:34px;line-height:1.1;font-weight:800;margin:4px 0}.subtitle{color:var(--muted);margin-top:8px;font-size:15px}.top-actions{display:flex;gap:10px}.primary-btn,.secondary-btn,.danger-btn,.icon-btn{border:0;border-radius:14px;padding:11px 14px;font-weight:750}.primary-btn{background:var(--text);color:#fff}.secondary-btn{background:var(--card);color:var(--text);border:1px solid var(--line)}.danger-btn{background:rgba(255,59,48,.1);color:var(--red)}.icon-btn{background:var(--soft);color:var(--text)}
.compact-points{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 11px;box-shadow:0 4px 14px rgba(0,0,0,.03);margin-bottom:14px}.compact-points .money{font-size:18px}.compact-points .score{font-weight:820}.compact-points .mini-meta{color:var(--muted);font-size:12px}
.summary-card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:18px;box-shadow:var(--shadow);margin-bottom:20px}.summary-card h2{margin:0;font-size:27px}.summary-card p{margin:7px 0 0;color:var(--muted)}.progress-ring{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--text) var(--progress),#ededf0 0);position:relative}.progress-ring:after{content:"";position:absolute;width:62px;height:62px;border-radius:50%;background:var(--card)}.progress-ring span{position:relative;z-index:1;font-weight:800;font-size:17px}.week-progress{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:2px}.week-day{text-align:center}.week-box{height:25px;border-radius:8px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800}.week-box.some{background:#fff3df;border-color:#ffe0ab}.week-box.done{background:#eaf8ee;border-color:#c9eccf}.week-label{font-size:10px;color:var(--muted);margin-top:4px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 12px}.section-header h3{margin:0;font-size:19px}.section-header button{border:0;background:transparent;color:var(--text);font-weight:800}.habit-list{display:grid;gap:12px}.habit-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}.habit-emoji{width:48px;height:48px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:26px}.habit-name{font-weight:760;font-size:17px}.habit-meta{color:var(--muted);font-size:13px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill,.reward-tag{padding:3px 8px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:700;color:#5a5a60}.check-btn{min-width:44px;height:44px;padding:0 8px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--text);font-size:14px;font-weight:850;display:grid;place-items:center;transition:.18s}.check-btn.done{background:var(--green);border-color:var(--green);color:#fff}.check-btn.partial{background:#fff8ec;border-color:#ffdca3;color:#a65d00}.empty{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 22px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}.empty .big{font-size:40px;margin-bottom:8px}
.calendar-card,.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}.calendar-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.calendar-toolbar h3{margin:0;font-size:20px}.calendar-toolbar div{display:flex;gap:8px}.calendar-toolbar button{min-width:36px;height:36px;border:0;border-radius:12px;background:var(--soft);color:var(--text);font-weight:750;padding:0 10px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;color:var(--muted);font-size:12px;font-weight:700;padding:8px 0}.day{min-height:82px;border-radius:14px;padding:8px;background:var(--soft);border:1px solid transparent;display:flex;flex-direction:column;gap:5px}.day.muted{opacity:.3}.day.today{border-color:#a8a8ad}.day.selected{outline:2px solid var(--text)}.day-num{font-size:13px;font-weight:750}.emoji-row{font-size:14px;line-height:1.2}.status-dot{margin-top:auto;width:7px;height:7px;border-radius:50%;background:var(--line)}.status-dot.all{background:var(--green)}.status-dot.some{background:var(--orange)}.calendar-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.7fr);gap:18px}.detail-list{display:grid;gap:10px;margin-top:14px}.detail-item{background:var(--soft);border-radius:16px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}.detail-left{display:flex;gap:10px;align-items:center}.detail-note{color:var(--muted);font-size:12px;margin-top:3px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.category-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 16px}.category-tabs{display:flex;gap:8px;overflow:auto;padding:2px 1px 6px;scrollbar-width:none}.category-tabs::-webkit-scrollbar{display:none}.category-tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px}.category-tab.active{background:var(--text);border-color:var(--text);color:#fff}.habit-manage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.manage-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);touch-action:none}.manage-card.dragging{opacity:.55;transform:scale(.985)}.manage-top{display:flex;justify-content:space-between;align-items:center}.manage-title{display:flex;align-items:center;gap:10px;font-weight:760}.manage-actions{display:flex;gap:8px;align-items:center}.mini-btn{border:0;border-radius:10px;background:var(--soft);padding:8px;color:var(--text)}.drag-handle{border:0;background:transparent;color:#b0b0b5;font-size:20px;line-height:1;padding:8px 4px;cursor:grab;touch-action:none}.category-manage-list{display:grid;gap:10px;margin-top:12px}.category-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft);padding:12px 14px;border-radius:14px}.category-count{color:var(--muted);font-size:12px}.category-actions{display:flex;gap:7px}
.points-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px 20px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.points-value{font-size:30px;font-weight:850}.points-label{font-size:13px;color:var(--muted);margin-top:3px}.points-chip{padding:8px 11px;border-radius:999px;background:var(--soft);font-weight:750;font-size:13px}.wish-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.wish-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:var(--shadow)}.wish-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.wish-icon{width:48px;height:48px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:25px}.wish-cost{font-size:19px;font-weight:820}.wish-desc{color:var(--muted);font-size:13px;line-height:1.45;margin:10px 0 14px}.wish-actions{display:flex;gap:8px}.wish-actions button{flex:1}.history-row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.history-row:last-child{border-bottom:0}.history-meta{color:var(--muted);font-size:12px;margin-top:3px}.disabled-btn{opacity:.42;cursor:not-allowed}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.stat-num{font-size:32px;font-weight:850}.stat-label{color:var(--muted);font-size:13px;margin-top:5px}.heatmap{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:16px}.heat{aspect-ratio:1;border-radius:4px;background:var(--line)}.heat.l1{background:rgba(52,199,89,.25)}.heat.l2{background:rgba(52,199,89,.55)}.heat.l3{background:var(--green)}.settings-list{display:grid;gap:12px}.setting-row{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:14px}.setting-title{font-weight:700}.setting-desc{color:var(--muted);font-size:13px;margin-top:4px}
.mobile-tabs{display:none}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(8px);z-index:100;display:none;align-items:flex-end;justify-content:center}.modal-backdrop.open{display:flex}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;scrollbar-width:none;background:var(--card);border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.18)}.modal::-webkit-scrollbar{display:none}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{margin:0;font-size:20px}.close{border:0;background:var(--soft);color:var(--text);width:34px;height:34px;border-radius:50%}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:14px;padding:12px;outline:none}.field textarea{min-height:88px;resize:vertical}.emoji-input-wrap{display:flex;align-items:center;gap:10px}.emoji-input{font-size:28px;text-align:center;width:72px!important}.emoji-picker{display:flex;gap:7px;overflow:auto;padding-bottom:4px;scrollbar-width:none}.emoji-picker::-webkit-scrollbar{display:none}.emoji-choice{flex:0 0 42px;border:1px solid var(--line);background:var(--soft);border-radius:12px;aspect-ratio:1;display:grid;place-items:center;font-size:22px}.emoji-choice.active{border-color:var(--text)}.modal-actions{display:flex;gap:10px;margin-top:18px}.modal-actions button{flex:1}.checkin-entries{display:grid;gap:8px;margin:12px 0}.entry-row{background:var(--soft);border-radius:14px;padding:11px}.entry-meta{font-size:12px;color:var(--muted);margin-bottom:5px}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;background:#1c1c1e;color:white;padding:12px 16px;border-radius:999px;z-index:200;transition:.25s;pointer-events:none;font-weight:650;font-size:14px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:860px){.app-shell{display:block;padding:14px 14px 92px}.sidebar{display:none}.main{padding-bottom:0}.title{font-size:30px}.calendar-layout{grid-template-columns:1fr}.habit-manage-grid,.wish-grid{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}.mobile-tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:10px;right:10px;bottom:10px;z-index:90;background:rgba(255,255,255,.86);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:22px;padding:7px;box-shadow:0 14px 44px rgba(0,0,0,.12)}.mobile-tabs button{border:0;background:transparent;color:var(--muted);border-radius:14px;padding:8px 4px;font-size:11px;display:flex;flex-direction:column;gap:4px;align-items:center;font-weight:700}.mobile-tabs button span{font-size:20px}.mobile-tabs button.active{background:var(--soft);color:var(--text)}.day{min-height:68px;padding:6px}}
@media(max-width:540px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.stats-grid{grid-template-columns:1fr 1fr}.calendar-grid{gap:3px}.day{min-height:62px;border-radius:10px}.day-num{font-size:12px}.top-actions{display:none}.summary-card{padding:16px}.progress-ring{width:72px;height:72px}.progress-ring:after{width:54px;height:54px}.category-toolbar{align-items:flex-start;flex-direction:column}.category-toolbar>.secondary-btn{align-self:flex-end}.week-progress{gap:4px}.week-box{height:22px}}
</style>
</head>
<body>
<div class="app-shell">
<aside class="sidebar"><div class="brand"><div class="brand-icon">✓</div><div><h1>Habit</h1><small>Habits & Rewards</small></div></div><nav class="nav">
<button class="active" data-page="today"><span class="icon">☀️</span>今天</button><button data-page="calendar"><span class="icon">📅</span>日历</button><button data-page="habits"><span class="icon">🧩</span>习惯</button><button data-page="rewards"><span class="icon">🎁</span>心愿</button><button data-page="stats"><span class="icon">📈</span>统计</button><button data-page="settings"><span class="icon">⚙️</span>设置</button></nav><div class="sidebar-bottom">数据保存在当前浏览器。<br>建议定期导出备份。</div></aside>
<main class="main"><section id="page-today" class="page active"></section><section id="page-calendar" class="page"></section><section id="page-habits" class="page"></section><section id="page-rewards" class="page"></section><section id="page-stats" class="page"></section><section id="page-settings" class="page"></section></main>
</div>
<nav class="mobile-tabs"><button class="active" data-page="today"><span>☀️</span>今天</button><button data-page="calendar"><span>📅</span>日历</button><button data-page="habits"><span>🧩</span>习惯</button><button data-page="rewards"><span>🎁</span>心愿</button><button data-page="settings"><span>⚙️</span>设置</button></nav>

<div class="modal-backdrop" id="habitModal"><div class="modal"><div class="modal-head"><h3 id="habitModalTitle">新建习惯</h3><button class="close" data-close="habitModal">✕</button></div><form id="habitForm"><input type="hidden" id="habitId"><div class="form-grid">
<div class="field full"><label>Emoji</label><div class="emoji-input-wrap"><input class="emoji-input" id="habitEmoji" value="📖" maxlength="8" inputmode="text"><span style="color:var(--muted);font-size:13px">可直接用输入法输入任意 Emoji</span></div><div class="emoji-picker" id="emojiPicker"></div></div>
<div class="field"><label>习惯名称</label><input id="habitName" required placeholder="例如：阅读"></div><div class="field"><label>分类</label><select id="habitCategory"></select></div>
<div class="field"><label>起始日期</label><input id="habitStart" type="date" required></div><div class="field"><label>重复方式</label><select id="habitRepeat"><option value="daily">每天</option><option value="interval">每隔 X 天</option><option value="weekdays">指定星期</option></select></div>
<div class="field" id="intervalField"><label>间隔天数</label><input id="habitInterval" type="number" min="1" value="2"></div><div class="field"><label>每日打卡次数</label><input id="habitDailyTarget" type="number" min="1" max="99" value="1"></div>
<div class="field"><label>每次打卡奖励积分</label><input id="habitReward" type="number" min="0" step="1" value="5"></div><div class="field full" id="weekdayField"><label>指定星期（可多选）</label><div style="display:flex;gap:6px;flex-wrap:wrap" id="weekdayPicker"></div></div>
<div class="field full"><label>说明（可选）</label><textarea id="habitDescription" placeholder="给这个习惯写一句说明"></textarea></div></div><div class="modal-actions"><button type="button" class="danger-btn" id="deleteHabitBtn" style="display:none">删除</button><button type="submit" class="primary-btn">保存</button></div></form></div></div>

<div class="modal-backdrop" id="checkinModal"><div class="modal"><div class="modal-head"><h3 id="checkinTitle">打卡备注</h3><button class="close" data-close="checkinModal">✕</button></div><form id="checkinForm"><input type="hidden" id="checkinHabitId"><input type="hidden" id="checkinDate"><input type="hidden" id="checkinEntryIndex"><div id="checkinProgressText" class="points-label"></div><div class="field full" style="margin-top:12px"><label>这次打卡备注</label><textarea id="checkinNote" placeholder="例如：今天完成得很顺利。"></textarea></div><div class="checkin-entries" id="checkinEntries"></div><div class="modal-actions"><button type="button" class="danger-btn" id="removeLatestCheckinBtn">撤销本次</button><button type="submit" class="primary-btn">保存</button></div></form></div></div>

<div class="modal-backdrop" id="wishModal"><div class="modal"><div class="modal-head"><h3 id="wishModalTitle">新建心愿</h3><button class="close" data-close="wishModal">✕</button></div><form id="wishForm"><input type="hidden" id="wishId"><div class="form-grid"><div class="field"><label>心愿 Emoji</label><input id="wishEmoji" maxlength="8" value="🎬"></div><div class="field"><label>心愿名称</label><input id="wishName" required placeholder="例如：去电影院看电影"></div><div class="field"><label>兑换所需积分</label><input id="wishCost" type="number" min="1" required value="100"></div><div class="field full"><label>说明（可选）</label><textarea id="wishDescription"></textarea></div></div><div class="modal-actions"><button type="button" class="secondary-btn" data-close="wishModal">取消</button><button type="submit" class="primary-btn">保存</button></div></form></div></div>

<div class="modal-backdrop" id="categoryModal"><div class="modal"><div class="modal-head"><h3>设置分类</h3><button class="close" data-close="categoryModal">✕</button></div><div class="field full"><label>新增分类</label><div style="display:flex;gap:8px"><input id="newCategoryName" placeholder="例如：健康、学习、运动"><button type="button" class="primary-btn" id="addCategoryBtn">添加</button></div></div><div class="category-manage-list" id="categoryManageList"></div><div class="modal-actions"><button type="button" class="secondary-btn" data-close="categoryModal">完成</button></div></div></div>

<div class="modal-backdrop" id="renameCategoryModal"><div class="modal"><div class="modal-head"><h3>重命名分类</h3><button class="close" data-close="renameCategoryModal">✕</button></div><input type="hidden" id="renameCategoryOld"><div class="field"><label>新名称</label><input id="renameCategoryName"></div><div class="modal-actions"><button type="button" class="secondary-btn" data-close="renameCategoryModal">取消</button><button type="button" class="primary-btn" id="saveRenameCategoryBtn">保存</button></div></div></div>
<div class="toast" id="toast"></div><input type="file" id="importFile" accept="application/json" hidden>
<script>
const STORAGE_KEY='habit_tracker_v1_data';
const emojis=['📖','🏃','💧','🧘','😴','💊','🧹','💰','🌱','🐕','🚴','🥗','✍️','🎧','🧠','🧴','🏋️','☀️','🌙','🎯','🧑‍💻','🍎','☕','🎨','🎸','🏕️','🪴','🦋','🍿','🛁','🧋','🐈‍⬛'];
const weekdays=['日','一','二','三','四','五','六'];
let state=loadState(),currentPage='today',calendarCursor=new Date(),selectedCalendarDate=formatDate(new Date()),currentHabitCategory='全部',dragHabitId=null;
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function defaultState(){const today=formatDate(new Date());return{theme:'light',categories:['学习','健康','运动'],habits:[{id:uid(),emoji:'📖',name:'阅读',category:'学习',startDate:today,repeat:'daily',interval:1,weekdays:[],dailyTarget:1,rewardPoints:5,description:'每天留一点时间给自己。'},{id:uid(),emoji:'💧',name:'喝水',category:'健康',startDate:today,repeat:'daily',interval:1,weekdays:[],dailyTarget:3,rewardPoints:2,description:'保持补水。'},{id:uid(),emoji:'🏃',name:'跑步',category:'运动',startDate:today,repeat:'interval',interval:2,weekdays:[],dailyTarget:1,rewardPoints:10,description:'轻松跑也算完成。'}],checkins:{},wishes:[{id:uid(),emoji:'🎬',name:'去电影院看电影',cost:100,description:'用坚持换一场真正想看的电影。'}],redemptions:[]}}
function normalizeCheckin(c,h){if(!c)return null;if(Array.isArray(c.entries)){return{entries:c.entries.map(e=>({note:e.note||'',rewardPoints:Number(e.rewardPoints??h?.rewardPoints??0),createdAt:e.createdAt||new Date().toISOString()}))}}if(c.done){return{entries:[{note:c.note||'',rewardPoints:Number(c.rewardPoints??h?.rewardPoints??0),createdAt:c.createdAt||new Date().toISOString()}]}}return{entries:[]}}
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY),x=raw?JSON.parse(raw):defaultState();x.wishes=Array.isArray(x.wishes)?x.wishes:[];x.redemptions=Array.isArray(x.redemptions)?x.redemptions:[];x.habits=Array.isArray(x.habits)?x.habits:[];x.habits.forEach(h=>{if(h.rewardPoints==null)h.rewardPoints=5;if(h.dailyTarget==null)h.dailyTarget=1});const derived=[...new Set(x.habits.map(h=>h.category).filter(c=>c&&c!=='未分类'))];x.categories=Array.isArray(x.categories)?[...new Set([...x.categories,...derived])]:derived;const migrated={};for(const [k,c] of Object.entries(x.checkins||{})){const hid=k.split('__')[0],h=x.habits.find(v=>v.id===hid);migrated[k]=normalizeCheckin(c,h)}x.checkins=migrated;return x}catch(e){return defaultState()}}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));renderAll()}
function formatDate(d){const x=new Date(d);return`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function parseDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}function prettyDate(s){const d=parseDate(s);return`${d.getMonth()+1}月${d.getDate()}日`}function prettyDateLong(s){const d=parseDate(s);return`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 周${weekdays[d.getDay()]}`}function daysBetween(a,b){return Math.round((parseDate(b)-parseDate(a))/(24*3600*1000))}
function escapeHtml(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function repeatLabel(h){if(h.repeat==='daily')return'每天';if(h.repeat==='interval')return`每 ${h.interval} 天`;if(h.repeat==='weekdays')return(h.weekdays||[]).map(i=>`周${weekdays[i]}`).join(' · ')||'未选择星期';return''}
function isScheduled(h,dateStr){if(dateStr<h.startDate)return false;const d=parseDate(dateStr);if(h.repeat==='daily')return true;if(h.repeat==='interval')return daysBetween(h.startDate,dateStr)%Math.max(1,Number(h.interval||1))===0;if(h.repeat==='weekdays')return(h.weekdays||[]).includes(d.getDay());return true}
function checkinKey(hid,date){return`${hid}__${date}`}function getCheckin(hid,date){return state.checkins[checkinKey(hid,date)]||{entries:[]}}function getCount(hid,date){return getCheckin(hid,date).entries?.length||0}function targetOf(h){return Math.max(1,Number(h.dailyTarget||1))}function isHabitDone(h,date){return getCount(h.id,date)>=targetOf(h)}function scheduledFor(date){return state.habits.filter(h=>isScheduled(h,date))}
function earnedPoints(){return Object.values(state.checkins).reduce((sum,c)=>sum+(c?.entries||[]).reduce((a,e)=>a+Number(e.rewardPoints||0),0),0)}function spentPoints(){return(state.redemptions||[]).reduce((s,r)=>s+Number(r.cost||0),0)}function pointBalance(){return Math.max(0,earnedPoints()-spentPoints())}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove('show'),1600)}
function pageHeader(eyebrow,title,subtitle,action=false){return`<div class="topbar"><div><div class="eyebrow">${eyebrow}</div><div class="title">${title}</div><div class="subtitle">${subtitle||''}</div></div><div class="top-actions">${action?'<button class="secondary-btn" onclick="openHabitModal()">＋ 添加</button>':''}</div></div>`}
function compactPoints(){return`<div class="compact-points" role="button" onclick="navigate('rewards')"><span class="money">💰</span><span class="score">${pointBalance()} 点</span><span class="mini-meta">可兑换</span></div>`}
function pointsSummary(){return`<div class="points-card"><div><div class="points-value">${pointBalance()} <span style="font-size:16px">点</span></div><div class="points-label">当前可兑换积分 · 累计获得 ${earnedPoints()} 点</div></div><div class="points-chip">🎁 ${state.wishes.length} 个心愿</div></div>`}
function weeklyBoxes(){const now=new Date(),day=now.getDay(),monday=new Date(now);monday.setDate(now.getDate()-((day+6)%7));return Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);const ds=formatDate(d),list=scheduledFor(ds),done=list.filter(h=>isHabitDone(h,ds)).length,ratio=list.length?done/list.length:0,cl=ratio===1&&list.length?'done':ratio>0?'some':'';return`<div class="week-day"><div class="week-box ${cl}">${done}/${list.length}</div><div class="week-label">${['一','二','三','四','五','六','日'][i]}</div></div>`}).join('')}
function renderToday(){const el=document.getElementById('page-today'),today=formatDate(new Date()),list=scheduledFor(today),done=list.filter(h=>isHabitDone(h,today)).length,pct=list.length?Math.round(done/list.length*100):0,dateFmt=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date());let html=pageHeader('TODAY','今天',dateFmt,false);html+=compactPoints();html+=`<div class="summary-card"><div><h2>${done} / ${list.length} 已完成</h2><p>${list.length?(done===list.length?'今天的计划全部完成 ✨':'按自己的节奏完成今天。'):'今天没有安排习惯。'}</p></div><div class="progress-ring" style="--progress:${pct}%"><span>${pct}%</span></div><div class="week-progress">${weeklyBoxes()}</div></div>`;html+=`<div class="section-header"><h3>今日习惯</h3><button onclick="openHabitModal()">添加</button></div>`;html+=list.length?`<div class="habit-list">${list.map(h=>habitCard(h,today)).join('')}</div>`:`<div class="empty"><div class="big">🌤️</div><b>今天没有安排</b></div>`;el.innerHTML=html}
function habitCard(h,date){const count=getCount(h.id,date),target=targetOf(h),done=count>=target,partial=count>0&&!done,label=target===1?(done?'✓':''):`${Math.min(count,target)}/${target}`;const c=getCheckin(h.id,date);return`<div class="habit-card"><div class="habit-emoji">${h.emoji}</div><div><div class="habit-name">${escapeHtml(h.name)}</div><div class="habit-meta"><span class="pill">${escapeHtml(h.category||'未分类')}</span><span>${repeatLabel(h)}</span><span class="reward-tag">＋${Number(h.rewardPoints||0)} 点 / 次</span>${target>1?`<span>${target} 次/日</span>`:''}${c.entries?.some(e=>e.note)?'<span>📝 有备注</span>':''}</div></div><button class="check-btn ${done?'done':partial?'partial':''}" onclick="tapCheckin('${h.id}','${date}')">${label}</button></div>`}
function tapCheckin(hid,date){const h=state.habits.find(x=>x.id===hid);if(!h)return;const c=getCheckin(hid,date),target=targetOf(h);if((c.entries||[]).length>=target){openCheckinModal(hid,date,c.entries.length-1);return}const entry={note:'',rewardPoints:Number(h.rewardPoints||0),createdAt:new Date().toISOString()};c.entries=[...(c.entries||[]),entry];state.checkins[checkinKey(hid,date)]=c;localStorage.setItem(STORAGE_KEY,JSON.stringify(state));renderAll();showToast(`打卡 +${entry.rewardPoints} 点`);openCheckinModal(hid,date,c.entries.length-1)}
function renderCalendar(){const el=document.getElementById('page-calendar'),y=calendarCursor.getFullYear(),m=calendarCursor.getMonth();let html=pageHeader('CALENDAR','日历','回看你的节奏，而不是追求完美。');html+=`<div class="calendar-layout"><div class="calendar-card"><div class="calendar-toolbar"><h3>${y}年 ${m+1}月</h3><div><button onclick="moveMonth(-1)">‹</button><button onclick="goThisYear()">${y}</button><button onclick="moveMonth(1)">›</button></div></div><div class="calendar-grid">${weekdays.map(w=>`<div class="dow">${w}</div>`).join('')}${calendarCells(y,m)}</div></div><div class="panel">${renderDayDetail(selectedCalendarDate)}</div></div>`;el.innerHTML=html}
function calendarCells(y,m){const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),today=formatDate(new Date());let out='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=formatDate(d),cur=d.getMonth()===m,list=scheduledFor(ds),done=list.filter(h=>isHabitDone(h,ds)).length,dot=list.length?(done===list.length&&done>0?'all':done>0?'some':''):'',em=list.filter(h=>getCount(h.id,ds)>0).slice(0,4).map(h=>h.emoji).join('');out+=`<button class="day ${cur?'':'muted'} ${ds===today?'today':''} ${ds===selectedCalendarDate?'selected':''}" onclick="selectCalendarDate('${ds}')" style="border:none;color:var(--text);text-align:left"><div class="day-num">${d.getDate()}</div><div class="emoji-row">${em}</div><div class="status-dot ${dot}"></div></button>`}return out}
function renderDayDetail(date){const list=scheduledFor(date);return`<div class="eyebrow">SELECTED DAY</div><h3 style="margin:6px 0 0">${prettyDateLong(date)}</h3><div class="detail-list">${list.length?list.map(h=>{const n=getCount(h.id,date),t=targetOf(h),done=n>=t,c=getCheckin(h.id,date);return`<div class="detail-item"><div class="detail-left"><div style="font-size:24px">${h.emoji}</div><div><b>${escapeHtml(h.name)}</b><div class="detail-note">${n}/${t} 次${c.entries?.some(e=>e.note)?' · 有备注':''}</div></div></div><button class="check-btn ${done?'done':n?'partial':''}" onclick="tapCheckin('${h.id}','${date}')">${t===1?(done?'✓':''):`${Math.min(n,t)}/${t}`}</button></div>`}).join(''):'<div class="empty" style="box-shadow:none;background:var(--soft)">这一天没有计划。</div>'}</div>`}
function moveMonth(n){calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+n,1);renderCalendar()}function goThisYear(){calendarCursor=new Date(calendarCursor.getFullYear(),new Date().getMonth(),1);selectedCalendarDate=formatDate(calendarCursor);renderCalendar()}function selectCalendarDate(d){selectedCalendarDate=d;calendarCursor=parseDate(d);renderCalendar()}
function allCategories(){return['全部',...(state.categories||[]),'未分类'].filter((v,i,a)=>a.indexOf(v)===i)}
function renderHabits(){const el=document.getElementById('page-habits'),cats=allCategories();if(!cats.includes(currentHabitCategory))currentHabitCategory='全部';const list=currentHabitCategory==='全部'?state.habits:state.habits.filter(h=>(h.category||'未分类')===currentHabitCategory);let html=pageHeader('HABITS','习惯','按分类查看，并拖拽调整顺序。',true);html+=`<div class="category-toolbar"><div class="category-tabs">${cats.map(c=>`<button class="category-tab ${c===currentHabitCategory?'active':''}" data-category-filter="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}</div><button class="secondary-btn" type="button" id="manageCategoriesBtn">设置分类</button></div><div class="habit-manage-grid" id="habitManageGrid">${list.length?list.map(h=>`<div class="manage-card" data-habit-card="${h.id}"><div class="manage-top"><div class="manage-title"><button class="drag-handle" type="button" data-drag-handle="${h.id}">≡</button><div class="habit-emoji" style="width:42px;height:42px">${h.emoji}</div><div><div>${escapeHtml(h.name)}</div><div class="habit-meta">${escapeHtml(h.category||'未分类')}</div></div></div><div class="manage-actions"><button class="mini-btn" type="button" data-edit-habit="${h.id}">✎</button><button class="mini-btn" type="button" data-delete-habit="${h.id}">🗑</button></div></div><div class="habit-meta" style="margin-top:14px"><span class="pill">从 ${prettyDate(h.startDate)}</span><span class="pill">${repeatLabel(h)}</span><span class="pill">${targetOf(h)} 次/日</span><span class="reward-tag">＋${Number(h.rewardPoints||0)} 点 / 次</span></div>${h.description?`<div style="color:var(--muted);font-size:13px;margin-top:12px">${escapeHtml(h.description)}</div>`:''}</div>`).join(''):'<div class="empty">这个分类里还没有习惯。</div>'}</div>`;el.innerHTML=html}
function deleteHabit(id){const h=state.habits.find(x=>x.id===id);if(!h)return;if(!confirm(`确定删除「${h.name}」？\n相关打卡记录也会删除。`))return;state.habits=state.habits.filter(x=>x.id!==id);Object.keys(state.checkins).forEach(k=>{if(k.startsWith(id+'__'))delete state.checkins[k]});closeModal('habitModal');saveState();showToast('已删除')}
function openCategoryModal(){renderCategoryManager();document.getElementById('newCategoryName').value='';openModal('categoryModal')}
function renderCategoryManager(){const box=document.getElementById('categoryManageList'),cats=state.categories||[];box.innerHTML=cats.length?cats.map(c=>`<div class="category-row"><div><b>${escapeHtml(c)}</b><div class="category-count">${state.habits.filter(h=>h.category===c).length} 个习惯</div></div><div class="category-actions"><button class="secondary-btn" type="button" data-rename-category="${escapeHtml(c)}">重命名</button><button class="danger-btn" type="button" data-delete-category="${escapeHtml(c)}">删除</button></div></div>`).join(''):'<div class="empty" style="box-shadow:none;background:var(--soft)">还没有自定义分类。</div>'}
function addCategory(){const input=document.getElementById('newCategoryName'),name=input.value.trim();if(!name)return;if(['全部','未分类'].includes(name)){showToast('该名称为系统保留');return}if(state.categories.includes(name)){showToast('分类已存在');return}state.categories.push(name);input.value='';saveState();openCategoryModal();showToast('分类已添加')}
function deleteCategory(name){const count=state.habits.filter(h=>h.category===name).length;if(!confirm(`删除分类「${name}」？${count?`\n${count} 个习惯会移动到“未分类”。`:''}`))return;state.habits.forEach(h=>{if(h.category===name)h.category='未分类'});state.categories=state.categories.filter(c=>c!==name);if(currentHabitCategory===name)currentHabitCategory='全部';saveState();openCategoryModal();showToast('分类已删除')}
function openRenameCategory(name){document.getElementById('renameCategoryOld').value=name;document.getElementById('renameCategoryName').value=name;closeModal('categoryModal');openModal('renameCategoryModal')}
function saveRenameCategory(){const old=document.getElementById('renameCategoryOld').value,name=document.getElementById('renameCategoryName').value.trim();if(!name||name===old){closeModal('renameCategoryModal');openCategoryModal();return}if(['全部','未分类'].includes(name)||state.categories.includes(name)){showToast('这个分类名称不可用');return}state.categories=state.categories.map(c=>c===old?name:c);state.habits.forEach(h=>{if(h.category===old)h.category=name});if(currentHabitCategory===old)currentHabitCategory=name;closeModal('renameCategoryModal');saveState();openCategoryModal();showToast('分类已重命名')}
function renderRewards(){const el=document.getElementById('page-rewards'),bal=pointBalance();let html=pageHeader('REWARDS','心愿','把坚持积累成可以真正享受的奖励。');html+=pointsSummary();html+=`<div class="section-header"><h3>我的心愿</h3><button onclick="openWishModal()">＋ 添加</button></div>`;html+=state.wishes.length?`<div class="wish-grid">${state.wishes.map(w=>{const can=bal>=Number(w.cost||0);return`<div class="wish-card"><div class="wish-top"><div class="wish-icon">${escapeHtml(w.emoji||'🎁')}</div><div style="text-align:right"><div class="wish-cost">${Number(w.cost||0)} 点</div><div class="points-label">${can?'现在可以兑换':'还差 '+Math.max(0,Number(w.cost||0)-bal)+' 点'}</div></div></div><div style="font-weight:790;font-size:17px;margin-top:13px">${escapeHtml(w.name)}</div><div class="wish-desc">${escapeHtml(w.description||'给自己的一个小奖励。')}</div><div class="wish-actions"><button class="secondary-btn" onclick="openWishModal('${w.id}')">编辑</button><button class="primary-btn ${can?'':'disabled-btn'}" ${can?'':'disabled'} onclick="redeemWish('${w.id}')">兑换</button></div></div>`}).join('')}</div>`:'<div class="empty">还没有心愿。</div>';html+=`<div class="panel" style="margin-top:18px"><div class="section-header" style="margin-top:0"><h3>兑换记录</h3></div>${state.redemptions.length?state.redemptions.slice().reverse().map(r=>`<div class="history-row"><div><b>${escapeHtml(r.emoji||'🎁')} ${escapeHtml(r.name)}</b><div class="history-meta">${new Date(r.redeemedAt).toLocaleString('zh-CN')}</div></div><b>−${Number(r.cost||0)} 点</b></div>`).join(''):'<div class="points-label">还没有兑换记录。</div>'}</div>`;el.innerHTML=html}
function openWishModal(id=''){document.getElementById('wishForm').reset();document.getElementById('wishId').value=id;document.getElementById('wishEmoji').value='🎁';document.getElementById('wishCost').value=100;document.getElementById('wishModalTitle').textContent=id?'编辑心愿':'新建心愿';if(id){const w=state.wishes.find(x=>x.id===id);if(w){document.getElementById('wishEmoji').value=w.emoji||'🎁';document.getElementById('wishName').value=w.name||'';document.getElementById('wishCost').value=w.cost;document.getElementById('wishDescription').value=w.description||''}}openModal('wishModal')}
function redeemWish(id){const w=state.wishes.find(x=>x.id===id);if(!w||pointBalance()<Number(w.cost))return;if(!confirm(`确认使用 ${w.cost} 点兑换「${w.name}」？`))return;state.redemptions.push({id:uid(),wishId:w.id,emoji:w.emoji,name:w.name,cost:Number(w.cost),redeemedAt:new Date().toISOString()});saveState();showToast('已兑换')}
function calcStats(){let scheduled=0,done=0;const start=new Date();start.setDate(start.getDate()-29);for(let i=0;i<30;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=formatDate(d),l=scheduledFor(ds);scheduled+=l.length;done+=l.filter(h=>isHabitDone(h,ds)).length}return{rate:scheduled?Math.round(done/scheduled*100):0}}
function habitStreak(h){let streak=0;const d=new Date();for(let i=0;i<365;i++){const x=new Date(d);x.setDate(d.getDate()-i);const ds=formatDate(x);if(!isScheduled(h,ds))continue;if(isHabitDone(h,ds))streak++;else break}return streak}
function renderStats(){const el=document.getElementById('page-stats'),s=calcStats(),streak=Math.max(0,...state.habits.map(habitStreak)),total=Object.values(state.checkins).reduce((a,c)=>a+(c.entries?.length||0),0);el.innerHTML=pageHeader('INSIGHTS','统计','看趋势，不给自己制造压力。')+`<div class="stats-grid"><div class="stat-card"><div class="stat-num">${s.rate}%</div><div class="stat-label">近 30 天完成率</div></div><div class="stat-card"><div class="stat-num">${streak}</div><div class="stat-label">当前最长连续完成</div></div><div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">累计打卡次数</div></div><div class="stat-card"><div class="stat-num">${earnedPoints()}</div><div class="stat-label">累计获得积分</div></div></div><div class="panel" style="margin-top:16px"><h3>最近 56 天</h3><div class="heatmap">${heatmapCells()}</div></div>`}
function heatmapCells(){const start=new Date();start.setDate(start.getDate()-55);let o='';for(let i=0;i<56;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=formatDate(d),l=scheduledFor(ds),n=l.filter(h=>isHabitDone(h,ds)).length,r=l.length?n/l.length:0,cl=r===0?'':r<.5?'l1':r<1?'l2':'l3';o+=`<div class="heat ${cl}" title="${ds} ${n}/${l.length}"></div>`}return o}
function renderSettings(){document.getElementById('page-settings').innerHTML=pageHeader('SETTINGS','设置','数据只保存在当前浏览器。')+`<div class="settings-list"><div class="setting-row"><div><div class="setting-title">积分规则</div><div class="setting-desc">每次打卡获得对应积分，达到每日次数后当天才算完成。</div></div><div class="points-chip">${pointBalance()} 点</div></div><div class="setting-row"><div><div class="setting-title">导出数据</div><div class="setting-desc">包含习惯、打卡、积分、心愿和兑换记录。</div></div><button class="secondary-btn" onclick="exportData()">导出</button></div><div class="setting-row"><div><div class="setting-title">导入数据</div><div class="setting-desc">从之前导出的 JSON 文件恢复。</div></div><button class="secondary-btn" onclick="document.getElementById('importFile').click()">导入</button></div><div class="setting-row"><div><div class="setting-title">重置全部数据</div><div class="setting-desc">删除所有习惯、打卡和兑换记录。</div></div><button class="danger-btn" onclick="resetData()">重置</button></div></div>`}
function renderAll(){renderToday();renderCalendar();renderHabits();renderRewards();renderStats();renderSettings();syncNav();fillCategorySelect()}
function navigate(p){currentPage=p;showPage(p)}function showPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+p)?.classList.add('active');syncNav()}function syncNav(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage))}
function openModal(id){document.getElementById(id).classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}
function renderEmojiPicker(){const selected=document.getElementById('habitEmoji').value;document.getElementById('emojiPicker').innerHTML=emojis.map(e=>`<button type="button" class="emoji-choice ${e===selected?'active':''}" data-emoji="${e}">${e}</button>`).join('')}
function renderWeekdayPicker(selected){document.getElementById('weekdayPicker').innerHTML=weekdays.map((w,i)=>`<label class="pill" style="display:flex;gap:5px;align-items:center"><input type="checkbox" name="weekday" value="${i}" ${selected.includes(i)?'checked':''}>周${w}</label>`).join('')}
function fillCategorySelect(){const sel=document.getElementById('habitCategory');if(!sel)return;const cur=sel.value;sel.innerHTML=[...(state.categories||[]),'未分类'].filter((v,i,a)=>a.indexOf(v)===i).map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');if([...sel.options].some(o=>o.value===cur))sel.value=cur}
function toggleRepeatFields(){const v=document.getElementById('habitRepeat').value;document.getElementById('intervalField').style.display=v==='interval'?'flex':'none';document.getElementById('weekdayField').style.display=v==='weekdays'?'flex':'none'}
function openHabitModal(id=''){const form=document.getElementById('habitForm');form.reset();document.getElementById('habitId').value=id;document.getElementById('habitStart').value=formatDate(new Date());document.getElementById('habitRepeat').value='daily';document.getElementById('habitInterval').value=2;document.getElementById('habitDailyTarget').value=1;document.getElementById('habitReward').value=5;document.getElementById('habitEmoji').value='📖';document.getElementById('habitDescription').value='';document.getElementById('habitModalTitle').textContent=id?'编辑习惯':'新建习惯';fillCategorySelect();const del=document.getElementById('deleteHabitBtn');del.style.display=id?'inline-flex':'none';del.dataset.deleteHabit=id||'';if(id){const h=state.habits.find(x=>x.id===id);if(h){document.getElementById('habitName').value=h.name;document.getElementById('habitCategory').value=h.category||'未分类';document.getElementById('habitStart').value=h.startDate;document.getElementById('habitRepeat').value=h.repeat;document.getElementById('habitInterval').value=h.interval||2;document.getElementById('habitDailyTarget').value=targetOf(h);document.getElementById('habitReward').value=Number(h.rewardPoints||0);document.getElementById('habitDescription').value=h.description||'';document.getElementById('habitEmoji').value=h.emoji;renderWeekdayPicker(h.weekdays||[])}}else renderWeekdayPicker([]);renderEmojiPicker();toggleRepeatFields();openModal('habitModal')}
function openCheckinModal(hid,date,index){const h=state.habits.find(x=>x.id===hid),c=getCheckin(hid,date);index=Math.max(0,Math.min(Number(index||0),Math.max(0,c.entries.length-1)));document.getElementById('checkinHabitId').value=hid;document.getElementById('checkinDate').value=date;document.getElementById('checkinEntryIndex').value=index;document.getElementById('checkinTitle').textContent=`${h?.emoji||''} ${h?.name||'打卡'} · ${prettyDate(date)}`;document.getElementById('checkinProgressText').textContent=`今日 ${c.entries.length}/${targetOf(h)} 次`;document.getElementById('checkinNote').value=c.entries[index]?.note||'';document.getElementById('checkinEntries').innerHTML=c.entries.map((e,i)=>`<div class="entry-row"><div class="entry-meta">第 ${i+1} 次 · +${Number(e.rewardPoints||0)} 点</div><div>${escapeHtml(e.note||'暂无备注')}</div></div>`).join('');document.getElementById('removeLatestCheckinBtn').style.display=c.entries.length?'inline-flex':'none';openModal('checkinModal')}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`habit-backup-${formatDate(new Date())}.json`;a.click();URL.revokeObjectURL(url)}function resetData(){if(!confirm('确定重置全部数据？'))return;state=defaultState();saveState()}

document.addEventListener('click',e=>{const cf=e.target.closest('[data-category-filter]');if(cf){currentHabitCategory=cf.dataset.categoryFilter;renderHabits();return}if(e.target.closest('#manageCategoriesBtn')){openCategoryModal();return}const rc=e.target.closest('[data-rename-category]');if(rc){openRenameCategory(rc.dataset.renameCategory);return}const dc=e.target.closest('[data-delete-category]');if(dc){deleteCategory(dc.dataset.deleteCategory);return}const em=e.target.closest('[data-emoji]');if(em){document.getElementById('habitEmoji').value=em.dataset.emoji;renderEmojiPicker();return}const p=e.target.closest('[data-page]');if(p){currentPage=p.dataset.page;showPage(currentPage);return}const edit=e.target.closest('[data-edit-habit]');if(edit){openHabitModal(edit.dataset.editHabit);return}const del=e.target.closest('[data-delete-habit]');if(del){deleteHabit(del.dataset.deleteHabit);return}const c=e.target.closest('[data-close]');if(c)closeModal(c.dataset.close)});
document.querySelectorAll('.modal-backdrop').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id)}));
document.getElementById('habitEmoji').addEventListener('input',renderEmojiPicker);document.getElementById('habitRepeat').addEventListener('change',toggleRepeatFields);document.getElementById('addCategoryBtn').addEventListener('click',addCategory);document.getElementById('saveRenameCategoryBtn').addEventListener('click',saveRenameCategory);document.getElementById('newCategoryName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addCategory()}});
document.getElementById('habitForm').addEventListener('submit',e=>{e.preventDefault();const id=document.getElementById('habitId').value||uid(),obj={id,emoji:document.getElementById('habitEmoji').value.trim()||'✨',name:document.getElementById('habitName').value.trim(),category:document.getElementById('habitCategory').value||'未分类',startDate:document.getElementById('habitStart').value,repeat:document.getElementById('habitRepeat').value,interval:Number(document.getElementById('habitInterval').value||1),dailyTarget:Math.max(1,Number(document.getElementById('habitDailyTarget').value||1)),rewardPoints:Number(document.getElementById('habitReward').value||0),weekdays:[...document.querySelectorAll('input[name="weekday"]:checked')].map(x=>Number(x.value)),description:document.getElementById('habitDescription').value.trim()};const idx=state.habits.findIndex(h=>h.id===id);if(idx>=0)state.habits[idx]=obj;else state.habits.push(obj);closeModal('habitModal');saveState();showToast('已保存')});
document.getElementById('deleteHabitBtn').addEventListener('click',e=>{const id=e.currentTarget.dataset.deleteHabit;if(id)deleteHabit(id)});
document.getElementById('checkinForm').addEventListener('submit',e=>{e.preventDefault();const hid=document.getElementById('checkinHabitId').value,date=document.getElementById('checkinDate').value,index=Number(document.getElementById('checkinEntryIndex').value),c=getCheckin(hid,date);if(c.entries[index])c.entries[index].note=document.getElementById('checkinNote').value.trim();state.checkins[checkinKey(hid,date)]=c;closeModal('checkinModal');saveState();showToast('已保存')});
document.getElementById('removeLatestCheckinBtn').addEventListener('click',()=>{const hid=document.getElementById('checkinHabitId').value,date=document.getElementById('checkinDate').value,c=getCheckin(hid,date);if(c.entries.length)c.entries.pop();if(c.entries.length)state.checkins[checkinKey(hid,date)]=c;else delete state.checkins[checkinKey(hid,date)];closeModal('checkinModal');saveState();showToast('已撤销本次')});
document.getElementById('wishForm').addEventListener('submit',e=>{e.preventDefault();const id=document.getElementById('wishId').value||uid(),obj={id,emoji:document.getElementById('wishEmoji').value.trim()||'🎁',name:document.getElementById('wishName').value.trim(),cost:Number(document.getElementById('wishCost').value||1),description:document.getElementById('wishDescription').value.trim()},idx=state.wishes.findIndex(w=>w.id===id);if(idx>=0)state.wishes[idx]=obj;else state.wishes.push(obj);closeModal('wishModal');saveState();showToast('已保存')});
document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{localStorage.setItem(STORAGE_KEY,r.result);state=loadState();renderAll();showToast('数据已导入')}catch(err){alert('无法读取该备份文件')}};r.readAsText(f);e.target.value=''});
// Touch/mouse drag sorting
function finishDrag(){if(!dragHabitId)return;const grid=document.getElementById('habitManageGrid'),visible=grid?[...grid.querySelectorAll('[data-habit-card]')].map(x=>x.dataset.habitCard):[];document.querySelector(`[data-habit-card="${dragHabitId}"]`)?.classList.remove('dragging');if(visible.length){const set=new Set(visible),lookup=new Map(state.habits.map(h=>[h.id,h])),queue=[...visible],ordered=[];for(const h of state.habits){const belongs=currentHabitCategory==='全部'||(h.category||'未分类')===currentHabitCategory;if(belongs&&set.has(h.id))ordered.push(lookup.get(queue.shift()));else ordered.push(h)}state.habits=ordered;localStorage.setItem(STORAGE_KEY,JSON.stringify(state));renderAll();showToast('顺序已保存')}dragHabitId=null}
document.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-drag-handle]');if(!h)return;dragHabitId=h.dataset.dragHandle;h.closest('[data-habit-card]')?.classList.add('dragging');h.setPointerCapture?.(e.pointerId);e.preventDefault()});document.addEventListener('pointermove',e=>{if(!dragHabitId)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('[data-habit-card]'),dragging=document.querySelector(`[data-habit-card="${dragHabitId}"]`),grid=document.getElementById('habitManageGrid');if(!target||!dragging||target===dragging||!grid)return;const r=target.getBoundingClientRect();grid.insertBefore(dragging,e.clientY<r.top+r.height/2?target:target.nextSibling)});document.addEventListener('pointerup',finishDrag);document.addEventListener('pointercancel',()=>{dragHabitId=null;renderHabits()});
renderWeekdayPicker([]);renderEmojiPicker();toggleRepeatFields();renderAll();
</script>
</body></html>
